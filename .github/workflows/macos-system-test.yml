name: macTest

run-name: macTest

on:
  workflow_dispatch:
    inputs:
      run_packaged:
        description: Build and test packaged DMG
        required: true
        type: boolean
        default: false
      media_url:
        description: External media URL used by yt-dlp analysis
        required: true
        type: string
        default: "https://www.nicovideo.jp/watch/sm29822304"
      include_raw_diagnostics:
        description: Upload raw screenshots, JSON, and logs for difficult debugging
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  media-url-preflight:
    name: Media URL preflight
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install Python and dependencies
        id: dependencies
        run: |
          uv python install
          uv sync --locked

      - name: Validate external media URL
        shell: bash
        env:
          MOCHISTAR_TEST_MEDIA_URL: ${{ inputs.media_url }}
        run: |
          mkdir -p macTest-results/preflight
          uv run python macTest/preflight_media_url.py \
            --url "$MOCHISTAR_TEST_MEDIA_URL" --output macTest-results/preflight

      - name: Upload raw URL preflight diagnostics
        if: ${{ always() && inputs.include_raw_diagnostics }}
        uses: actions/upload-artifact@v7
        with:
          name: debug-preflight
          path: macTest-results/preflight
          if-no-files-found: warn
          retention-days: 14

  script-system:
    name: macOS 15 ${{ matrix.architecture }} script test
    needs: media-url-preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: intel
            runner: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure test release repository
        shell: bash
        run: |
          printf '%s\n\nGITHUB_REPOSITORY = "%s"\nIS_TEST_BUILD = True\n' \
            '"""保存 macTest 注入的 Release 設定"""' "$GITHUB_REPOSITORY" \
            > src/release_config.py

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install Python and dependencies
        id: dependencies
        run: |
          uv python install
          uv sync --locked

      - name: Run platform checks
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        shell: bash
        env:
          MOCHISTAR_RESULT_DIR: macTest-results/platform
        run: |
          set -o pipefail
          mkdir -p "$MOCHISTAR_RESULT_DIR"
          uv run python macTest/run_platform_checks.py \
            2>&1 | tee "$MOCHISTAR_RESULT_DIR/runner.log"

      - name: Run source application probes
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        shell: bash
        env:
          MOCHISTAR_TEST_MEDIA_URL: ${{ inputs.media_url }}
          MOCHISTAR_GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p macTest-results/probes
          uv run python macTest/run_source_probes.py \
            --media-url "$MOCHISTAR_TEST_MEDIA_URL" --output macTest-results/probes

      - name: Capture UI and run live analysis
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p macTest-results/ui
          QT_SCALE_FACTOR=1 uv run python macTest/capture_ui.py \
            --output macTest-results/ui 2>&1 | tee macTest-results/ui/runner.log

      - name: Add script result summary
        if: always()
        shell: bash
        run: |
          {
            echo "## macOS ${{ matrix.architecture }} script test"
            echo
            echo "Runner: ${{ matrix.runner }}"
            if [ -f macTest-results/probes/update.json ] && \
               [ -f macTest-results/probes/media-local.json ] && \
               [ -f macTest-results/probes/media-external.json ]; then
              echo "Source application probes produced diagnostic reports"
            else
              echo "One or more source probe reports are missing"
            fi
            if [ -f macTest-results/ui/report.json ]; then
              echo "Generated page, dropdown, dialog, and live analysis screenshots"
            else
              echo "UI capture stopped before report.json was created, inspect runner.log"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build script test bundle
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        shell: bash
        run: |
          uv run python macTest/build_artifact_bundle.py \
            --source macTest-results \
            --output macTest-results/final-script-${{ matrix.architecture }} \
            --title "MochiStar ${{ matrix.architecture }} script test"

      - name: Upload script test staging bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macTest-staging-script-${{ matrix.architecture }}
          path: macTest-results/final-script-${{ matrix.architecture }}
          if-no-files-found: warn
          retention-days: 14

      - name: Upload raw script diagnostics
        if: ${{ always() && inputs.include_raw_diagnostics }}
        uses: actions/upload-artifact@v7
        with:
          name: debug-script-${{ matrix.architecture }}
          path: |
            macTest-results
            !macTest-results/final-*/**
          if-no-files-found: warn
          retention-days: 14

  packaged-system:
    name: macOS 15 ${{ matrix.architecture }} packaged app
    if: ${{ inputs.run_packaged }}
    needs: script-system
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: intel
            runner: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure test release repository
        shell: bash
        run: |
          printf '%s\n\nGITHUB_REPOSITORY = "%s"\nIS_TEST_BUILD = True\n' \
            '"""保存 packaging workflow 注入的 Release 設定"""' "$GITHUB_REPOSITORY" \
            > src/release_config.py

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install Python and dependencies
        id: dependencies
        shell: bash
        run: |
          uv python install
          uv sync --locked

      - name: Build release-equivalent macOS app
        shell: bash
        run: bash .github/scripts/build-macos-app.sh MochiStar-macTest.dmg

      - name: Run packaged application probes
        shell: bash
        env:
          MOCHISTAR_TEST_MEDIA_URL: ${{ inputs.media_url }}
          MOCHISTAR_GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p macTest-results/packaged
          bash .github/scripts/run-macos-packaged-system.sh \
            MochiStar-macTest.dmg macTest-results/packaged "$MOCHISTAR_TEST_MEDIA_URL"

      - name: Add packaged result summary
        if: always()
        shell: bash
        run: |
          {
            echo "## macOS ${{ matrix.architecture }} packaged application"
            echo
            echo "Runner: ${{ matrix.runner }}"
            echo "Architecture: $(uname -m)"
            if [ -f macTest-results/packaged/update.json ] && \
               [ -f macTest-results/packaged/media-local.json ] && \
               [ -f macTest-results/packaged/media-external.json ]; then
              echo "Packaged application probes produced diagnostic reports"
            else
              echo "One or more packaged probe reports are missing, inspect build and probe logs"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build packaged test bundle
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        shell: bash
        run: |
          uv run python macTest/build_artifact_bundle.py \
            --source macTest-results \
            --output macTest-results/final-package-${{ matrix.architecture }} \
            --title "MochiStar ${{ matrix.architecture }} packaged test"

      - name: Upload packaged diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macTest-staging-package-${{ matrix.architecture }}
          path: macTest-results/final-package-${{ matrix.architecture }}
          if-no-files-found: warn
          retention-days: 14

      - name: Upload raw packaged diagnostics
        if: ${{ always() && inputs.include_raw_diagnostics }}
        uses: actions/upload-artifact@v7
        with:
          name: debug-package-${{ matrix.architecture }}
          path: |
            macTest-results
            !macTest-results/final-*/**
          if-no-files-found: warn
          retention-days: 14

  bundle-results:
    name: Bundle macTest results
    if: ${{ always() && needs['media-url-preflight'].result == 'success' }}
    needs: [media-url-preflight, script-system, packaged-system]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download architecture results
        uses: actions/download-artifact@v8
        with:
          pattern: macTest-staging-*
          path: staging

      - name: Arrange one result bundle
        shell: bash
        run: |
          mkdir -p macTest-results
          for directory in staging/macTest-staging-*; do
            name="${directory##*/macTest-staging-}"
            mv "$directory" "macTest-results/$name"
          done

      - name: Upload macTest results
        id: final-upload
        uses: actions/upload-artifact@v7
        with:
          name: macTest-results
          path: macTest-results
          if-no-files-found: error
          retention-days: 14

      - name: Remove staging artifacts
        if: ${{ steps.final-upload.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate \
            --jq '.artifacts[] | select(.name | startswith("macTest-staging-")) | .id' > staging-artifact-ids.txt
          while IFS= read -r artifact_id; do
            if [ -n "$artifact_id" ]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
            fi
          done < staging-artifact-ids.txt
