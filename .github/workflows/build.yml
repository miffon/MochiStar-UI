name: Build MochiStar

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && 'Test Build'
      || format('Release MochiStar {0}', github.ref_name) }}
      
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          version_source = Path("src/version.py").read_text(encoding="utf-8")
          runtime_match = re.search(r'^__version__ = "([^"]+)"$', version_source, re.MULTILINE)
          if not runtime_match or runtime_match.group(1) != version:
              raise SystemExit("Package __version__ does not match pyproject.toml")
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit(f"Release tag must use vMAJOR.MINOR.PATCH: {tag}")
          if tag != f"v{version}":
              raise SystemExit(f"Release tag {tag} does not match project version {version}")
          print(f"Validated {tag}")
          PY

  build-windows:
    needs: validate-version
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure release repository
        shell: pwsh
        run: |
          Set-Content -Path src/release_config.py -Encoding utf8 -Value @(
            '"""保存 packaging workflow 注入的 Release 設定"""'
            ''
            "GITHUB_REPOSITORY = `"$env:GITHUB_REPOSITORY`""
          )

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --locked

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest

      - name: Build Windows executable
        run: >
          uv run
          --with nuitka
          --with ordered-set
          --with zstandard
          python -m nuitka
          --standalone
          --enable-plugin=pyside6
          --include-package=yt_dlp
          --include-package-data=yt_dlp
          --nofollow-import-to=yt_dlp.extractor.lazy_extractors
          --include-data-dir=src/assets=assets
          --windows-console-mode=disable
          --windows-icon-from-ico=src/assets/logo.ico
          --assume-yes-for-downloads
          --output-dir=dist
          --output-filename=MochiStar.exe
          src/main.py

      - name: Build Windows launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw "Visual Studio C++ build tools were not found" }
          Import-Module "$installation\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"

          New-Item -ItemType Directory -Force -Path dist\launcher | Out-Null
          rc.exe /nologo /fo dist\launcher\launcher.res packaging\windows\launcher.rc
          if ($LASTEXITCODE -ne 0) { throw "Unable to compile the Windows launcher resources" }
          cl.exe /nologo /std:c11 /O2 /W4 /MT /Fodist\launcher\launcher.obj packaging\windows\launcher.c dist\launcher\launcher.res user32.lib shell32.lib /link /SUBSYSTEM:WINDOWS /OUT:dist\launcher\MochiStar.exe
          if ($LASTEXITCODE -ne 0) { throw "Unable to compile the Windows launcher" }

      - name: Package Windows artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $standalone = Get-Item -Path dist\main.dist
          New-Item -ItemType Directory -Force -Path artifact\MochiStar\app | Out-Null
          Copy-Item -Path "$($standalone.FullName)\*" -Destination artifact\MochiStar\app -Recurse
          Copy-Item -Path dist\launcher\MochiStar.exe -Destination artifact\MochiStar\MochiStar.exe
          Copy-Item -Path README.md -Destination artifact\MochiStar\README.md

          $rootEntries = @(Get-ChildItem -Path artifact\MochiStar | Select-Object -ExpandProperty Name)
          $unexpectedRootEntries = @($rootEntries | Where-Object { $_ -notin @("MochiStar.exe", "README.md", "app") })
          if ($rootEntries.Count -ne 3 -or $unexpectedRootEntries.Count -ne 0) {
            throw "Windows portable root must contain only MochiStar.exe, README.md, and app"
          }
          if (-not (Test-Path artifact\MochiStar\app\MochiStar.exe -PathType Leaf)) { throw "Standalone MochiStar.exe was not packaged" }
          if (-not (Test-Path artifact\MochiStar\app\assets -PathType Container)) { throw "Standalone assets directory was not packaged" }

          $env:QT_QPA_PLATFORM = "offscreen"
          $launcher = Start-Process -FilePath (Resolve-Path artifact\MochiStar\MochiStar.exe) -PassThru
          $child = $null
          $innerPath = (Resolve-Path artifact\MochiStar\app\MochiStar.exe).Path
          for ($attempt = 0; $attempt -lt 20 -and -not $child; $attempt++) {
            Start-Sleep -Milliseconds 500
            $child = Get-Process -Name MochiStar -ErrorAction SilentlyContinue |
              Where-Object { $_.Path -eq $innerPath } |
              Select-Object -First 1
          }
          if (-not $child) {
            if (-not $launcher.HasExited) { Stop-Process -Id $launcher.Id -Force }
            throw "Windows launcher did not start app\MochiStar.exe"
          }
          Stop-Process -Id $child.Id -Force
          $launcher.WaitForExit(10000) | Out-Null
          if (-not $launcher.HasExited) { Stop-Process -Id $launcher.Id -Force }

          Compress-Archive -Path artifact\MochiStar -DestinationPath MochiStar-Windows-portable.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: MochiStar-Windows-portable
          path: MochiStar-Windows-portable.zip
          if-no-files-found: error

  build-macos:
    needs: validate-version
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure release repository
        run: printf '%s\n\nGITHUB_REPOSITORY = "%s"\n' '"""保存 packaging workflow 注入的 Release 設定"""' "$GITHUB_REPOSITORY" > src/release_config.py

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --locked

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest

      - name: Build macOS app
        run: >
          uv run
          --with nuitka
          --with ordered-set
          --with zstandard
          python -m nuitka
          --standalone
          --enable-plugin=pyside6
          --include-package=yt_dlp
          --include-package-data=yt_dlp
          --nofollow-import-to=yt_dlp.extractor.lazy_extractors
          --include-data-dir=src/assets=assets
          --macos-create-app-bundle
          --macos-app-name=MochiStar
          --macos-app-icon=src/assets/logo.icns
          --assume-yes-for-downloads
          --output-dir=dist
          --output-filename=MochiStar
          src/main.py

      - name: Package macOS artifact
        run: |
          set -euo pipefail
          app_path="dist/main.app"
          if [ ! -d "$app_path" ]; then
            echo "main.app was not found under dist"
            find dist -maxdepth 4 -print
            exit 1
          fi

          mkdir -p artifact/dmg-root
          cp -R "$app_path" artifact/dmg-root/MochiStar.app
          ln -s /Applications artifact/dmg-root/Applications
          chmod +x artifact/dmg-root/MochiStar.app/Contents/MacOS/*
          xattr -cr artifact/dmg-root/MochiStar.app
          codesign --force --deep --sign - artifact/dmg-root/MochiStar.app
          hdiutil create -volname MochiStar -srcfolder artifact/dmg-root -ov -format UDZO MochiStar-macOS-installer.dmg

      - name: Validate macOS DMG
        run: |
          set -euo pipefail
          mount_path="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_path" >/dev/null 2>&1 || true
            rmdir "$mount_path" 2>/dev/null || true
          }
          trap cleanup EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_path" MochiStar-macOS-installer.dmg
          test -d "$mount_path/MochiStar.app"
          test -L "$mount_path/Applications"
          test "$(readlink "$mount_path/Applications")" = "/Applications"
          test "$(find "$mount_path" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = "2"
          codesign --verify --deep --strict "$mount_path/MochiStar.app"

      - name: Upload macOS build
        uses: actions/upload-artifact@v7
        with:
          name: MochiStar-macOS-installer
          path: MochiStar-macOS-installer.dmg
          if-no-files-found: error

  build-linux:
    needs: validate-version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure release repository
        run: printf '%s\n\nGITHUB_REPOSITORY = "%s"\n' '"""保存 packaging workflow 注入的 Release 設定"""' "$GITHUB_REPOSITORY" > src/release_config.py

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes libegl1 patchelf

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --locked

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest

      - name: Build Linux executable
        run: >
          uv run
          --with nuitka
          --with ordered-set
          --with zstandard
          python -m nuitka
          --standalone
          --enable-plugin=pyside6
          --include-package=yt_dlp
          --include-package-data=yt_dlp
          --nofollow-import-to=yt_dlp.extractor.lazy_extractors
          --include-data-dir=src/assets=assets
          --linux-icon=src/assets/logo.svg
          --assume-yes-for-downloads
          --output-dir=dist
          --output-filename=MochiStar
          src/main.py

      - name: Package Linux artifact
        run: |
          set -euo pipefail
          mkdir -p artifact/MochiStar/app
          cp -R dist/main.dist/. artifact/MochiStar/app/
          cp packaging/linux/MochiStar artifact/MochiStar/MochiStar
          cp README.md artifact/MochiStar/README.md
          chmod +x artifact/MochiStar/MochiStar artifact/MochiStar/app/MochiStar
          mapfile -t root_entries < <(find artifact/MochiStar -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          expected_entries=(MochiStar README.md app)
          test "${root_entries[*]}" = "${expected_entries[*]}"
          test -x artifact/MochiStar/MochiStar
          test -x artifact/MochiStar/app/MochiStar
          test -d artifact/MochiStar/app/assets
          sh -n artifact/MochiStar/MochiStar

          QT_QPA_PLATFORM=offscreen artifact/MochiStar/MochiStar &
          application_pid=$!
          sleep 3
          if ! kill -0 "$application_pid" 2>/dev/null; then
            wait "$application_pid"
            echo "Linux launcher did not keep app/MochiStar running"
            exit 1
          fi
          kill "$application_pid"
          wait "$application_pid" || true
          tar -C artifact -czf MochiStar-Linux.tar.gz MochiStar

      - name: Upload Linux build
        uses: actions/upload-artifact@v7
        with:
          name: MochiStar-Linux
          path: MochiStar-Linux.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-windows
      - build-macos
      - build-linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p release-files
          cp release-assets/MochiStar-Windows-portable/MochiStar-Windows-portable.zip release-files/
          cp release-assets/MochiStar-macOS-installer/MochiStar-macOS-installer.dmg release-files/
          cp release-assets/MochiStar-Linux/MochiStar-Linux.tar.gz release-files/

      - name: Build release notes
        run: |
          set -euo pipefail
          {
            echo "MochiStar ${GITHUB_REF_NAME}"
            echo
            cat .github/release-notes.md
          } > release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MochiStar ${{ github.ref_name }}
          body_path: release-body.md
          files: release-files/*
